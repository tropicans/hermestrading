services:
  redis:
    image: redis:7-alpine
    container_name: hermes_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  orchestrator:
    build: .
    container_name: hermes_orchestrator
    restart: always
    working_dir: /app/services/orchestrator
    command: ["python", "-u", "src/main.py"]
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  workers:
    build: .
    container_name: hermes_workers
    restart: always
    working_dir: /app/services/workers
    command: ["python", "-u", "src/main.py"]
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  guardian:
    build: .
    container_name: hermes_guardian
    restart: always
    working_dir: /app/services/guardian
    command: ["python", "-u", "src/main.py"]
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups

  backup_vault:
    build: .
    container_name: hermes_backup_vault
    restart: always
    working_dir: /app/services/backup_vault
    command: ["python", "-u", "backup_daemon.py"]
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups

volumes:
  redis_data:
